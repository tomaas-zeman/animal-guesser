name: Namluvit hlasy

# Namluví chybějící věty postaviček: se secretem TTS_API_KEY hlasy Google Chirp 3 HD,
# bez něj neuronovými hlasy Microsoft Edge (zdarma, bez klíče). Hlasy jsou v scripts/hlasy-tts.json.
# a nahrávky commitne do větve, na které běží. Každá postavička běží ve vlastním jobu
# (jiný stroj, souběžně). Namlouvá se jen rozdíl: věty, které nahrávku ještě nemají;
# nahrávky vět, které už hra neříká, se smažou.
# Spouští se ručně (Actions → Namluvit hlasy → Run workflow) a samo, když se v master
# změní hlášky, otázky nebo nastavení hlasů.
on:
  workflow_dispatch:
    inputs:
      postava:
        description: 'Jen jedna postavička (liska, banan, vojtacu), prázdné = všechny'
        required: false
        default: ''
      prepsat:
        description: 'Namluvit znovu i to, co už nahrané je (např. po změně hlasu)'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - src/postavicky/hlasky.ts
      - src/data/zvirata.json
      - scripts/hlasy-tts.json
      - scripts/tts.ts

permissions:
  contents: write
  actions: write

concurrency:
  group: hlasy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  namluvit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postava: [liska, banan, vojtacu]
    steps:
      - uses: actions/checkout@v4
        if: inputs.postava == '' || inputs.postava == matrix.postava
      - uses: actions/setup-node@v4
        if: inputs.postava == '' || inputs.postava == matrix.postava
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: inputs.postava == '' || inputs.postava == matrix.postava
        with:
          python-version: '3.12'
      - name: Instalace
        if: inputs.postava == '' || inputs.postava == matrix.postava
        run: |
          npm ci
          pip install --upgrade edge-tts
      - name: Namluvit
        if: inputs.postava == '' || inputs.postava == matrix.postava
        # co se nestihne, doplní příští běh (namlouvá se jen to, co chybí)
        timeout-minutes: 60
        env:
          PREPSAT: ${{ inputs.prepsat }}
          # s klíčem v secrets (TTS_API_KEY) namlouvá Google (Chirp 3 HD), bez něj zdarma Edge
          GOOGLE_TTS_KEY: ${{ secrets.TTS_API_KEY || secrets.GOOGLE_TTS_KEY }}
        run: |
          sluzba=$([ -n "$GOOGLE_TTS_KEY" ] && echo google || echo edge)
          echo "Služba: $sluzba"
          npm run hlasy:tts -- $sluzba --postava ${{ matrix.postava }} $([ "$PREPSAT" = "true" ] && echo --prepsat)
      # i po chybě se uloží, co se stihlo namluvit
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.postava == '' || inputs.postava == matrix.postava)
        with:
          name: hlasy-${{ matrix.postava }}
          path: public/hlasy/${{ matrix.postava }}/
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: namluvit
    # i když se některá postavička nepovedla nebo se běh zrušil, co je hotové, se uloží
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hlasy-*
          path: /tmp/hlasy
      - name: Commit nahrávek
        id: commit
        run: |
          # složka postavičky se nahradí celá, aby zmizely i smazané nahrávky
          for d in /tmp/hlasy/hlasy-*; do
            [ -d "$d" ] || continue
            p=${d##*/hlasy-}
            rm -rf "public/hlasy/$p"
            mkdir -p "public/hlasy/$p"
            cp "$d"/* "public/hlasy/$p/"
          done
          # složky postaviček, které už ve hře nejsou (třeba po přejmenování), se smažou; seznam je stejný jako v matrix
          for d in public/hlasy/*/; do
            p=$(basename "$d")
            case " liska banan vojtacu " in *" $p "*) ;; *) rm -rf "$d" ;; esac
          done
          git add -A public/hlasy
          if git diff --cached --quiet; then echo "Nic nového."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Namluvené hlasy postaviček"
          git pull --rebase
          git push
          echo "zmena=1" >> "$GITHUB_OUTPUT"
      # push z workflow nespouští další workflow, nasazení proto spustíme ručně
      - name: Nasadit
        if: steps.commit.outputs.zmena == '1' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
